<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    try{const saved=localStorage.getItem("ledgerline-theme-mode")||"auto",mode=["auto","light","dark"].includes(saved)?saved:"auto",systemDark=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.themeMode=mode;document.documentElement.dataset.theme=mode==="auto"?(systemDark?"dark":"light"):mode}catch{document.documentElement.dataset.theme="light";document.documentElement.dataset.themeMode="auto"}
  </script>
  <title>{% block title %}Ledgerline{% endblock %} · Billing</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">L</span><span>ledgerline<small>GST BILLING DESK</small></span></a>
    {% if cfg.company.name %}<div class="workspace"><span class="workspace-label">YOUR WORKSPACE</span><strong>{{ cfg.company.name }}</strong><small>{{ cfg.company.gstin }}</small></div>{% endif %}
    <nav><a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}"><span>◫</span> Overview</a><a href="/new" class="nav-link {% if request.path == '/new' %}active{% endif %}"><span>＋</span> Create bill</a><a href="/hsn-master" class="nav-link {% if request.path == '/hsn-master' %}active{% endif %}"><span>⌕</span> HSN code master</a><a href="/setup" class="nav-link {% if request.path == '/setup' %}active{% endif %}"><span>⚙</span> Company settings</a><a href="/" class="nav-link"><span>▦</span> Switch profile</a></nav>
    <div class="text-controls" aria-label="Display size controls"><span>DISPLAY SIZE</span><div><button type="button" id="text-smaller" aria-label="Decrease text size">A−</button><output id="text-size-value" aria-live="polite">100%</output><button type="button" id="text-larger" aria-label="Increase text size">A+</button></div></div>
    <div class="theme-controls"><span>APPEARANCE</span><button type="button" id="theme-toggle" aria-label="Theme mode: automatic. Click to switch theme"><span aria-hidden="true">◐</span><span id="theme-mode-label">Theme: Auto</span></button></div>
    <div class="sidebar-note"><span class="status-dot"></span>Stored on this computer</div>
  </aside>
  <main class="main">{% block content %}{% endblock %}</main>
  <script>
    document.querySelectorAll('input[name="gstin"],input[name="ship_gstin"]').forEach(input=>input.addEventListener("input",()=>{const start=input.selectionStart;input.value=input.value.toUpperCase();if(start!==null)input.setSelectionRange(start,start)}));
    (()=>{const key="ledgerline-display-scale",min=.8,max=1.4,step=.1;let scale=Number(localStorage.getItem(key))||1;const value=document.getElementById("text-size-value"),smaller=document.getElementById("text-smaller"),larger=document.getElementById("text-larger");function apply(){document.body.style.zoom=String(scale);value.value=Math.round(scale*100)+"%";value.textContent=value.value;smaller.disabled=scale<=min;larger.disabled=scale>=max;localStorage.setItem(key,String(scale))}smaller.addEventListener("click",()=>{scale=Math.max(min,Math.round((scale-step)*100)/100);apply()});larger.addEventListener("click",()=>{scale=Math.min(max,Math.round((scale+step)*100)/100);apply()});apply()})();
    (()=>{const root=document.documentElement,button=document.getElementById("theme-toggle"),label=document.getElementById("theme-mode-label"),media=window.matchMedia("(prefers-color-scheme: dark)");let mode=root.dataset.themeMode||"auto";const modes=["auto","dark","light"];function apply(){const dark=mode==="dark"||(mode==="auto"&&media.matches);root.dataset.themeMode=mode;root.dataset.theme=dark?"dark":"light";root.style.colorScheme=dark?"dark":"light";label.textContent="Theme: "+(mode==="auto"?"Auto":mode[0].toUpperCase()+mode.slice(1));button.setAttribute("aria-label","Theme mode: "+(mode==="auto"?"automatic":mode)+". Click to switch theme");localStorage.setItem("ledgerline-theme-mode",mode)}button.addEventListener("click",()=>{mode=modes[(modes.indexOf(mode)+1)%modes.length];apply()});media.addEventListener("change",()=>{if(mode==="auto")apply()});apply()})();
  </script>
</body></html>
