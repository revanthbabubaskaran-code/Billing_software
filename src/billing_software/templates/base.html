<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledgerline{% endblock %} · Billing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">L</span><span>ledgerline<small>GST BILLING DESK</small></span></a>
    {% if cfg.company.name %}<div class="workspace"><span class="workspace-label">YOUR WORKSPACE</span><strong>{{ cfg.company.name }}</strong><small>{{ cfg.company.gstin }}</small></div>{% endif %}
    <nav><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><span>◫</span> Overview</a><a href="/new" class="nav-link {% if request.path == '/new' %}active{% endif %}"><span>＋</span> Create bill</a><a href="/setup" class="nav-link {% if request.path == '/setup' %}active{% endif %}"><span>⚙</span> Company settings</a></nav>
    <div class="sidebar-note"><span class="status-dot"></span>Stored on this computer</div>
  </aside>
  <main class="main">{% block content %}{% endblock %}</main>
</body></html>
