[project]
name = "billing-software"
version = "0.1.0"
description = "Local GST invoicing for small businesses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Flask>=3.1,<4",
    "reportlab>=4.2,<5",
]

[project.scripts]
billing-software = "billing_software:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
